<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClinicScribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/><path d="M7 11h3l1.5-2 2 4 1.5-2h2"/></svg></div>
    <div class="brand"><strong>ClinicScribe</strong><span data-i18n="tagline"></span></div>
    <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="privacy"></span></div>
  </div>
</header>

<main class="wrap">
  <div class="langbar" id="langs" role="radiogroup" aria-label="Language"></div>

  <div class="grid">
    <div class="col">
      <section class="card" id="station" data-status="ready">
        <div class="card-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-1"/><circle cx="20" cy="12" r="2"/></svg><span data-i18n="stationTitle"></span></h2>
          <span class="pill" id="pill"><i></i><b id="pillText"></b></span>
        </div>
        <p class="muted" data-i18n="stationDesc"></p>

        <div class="station-row">
          <button class="mic" id="mic" type="button" aria-pressed="false">
            <svg class="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
          </button>
          <button class="btn" id="stopVoice" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg><span data-i18n="stopVoice"></span>
          </button>
          <div class="meter">
            <div class="time" id="timer">00:00</div>
            <div class="meter-row"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="muted" id="timerLabel"></span></div>
          </div>
        </div>
        <div class="station-foot">
          <p class="muted" id="hint" aria-live="polite"></p>
          <label class="toggle"><input type="checkbox" id="autospeak" checked><span class="track"><span class="thumb"></span></span><span data-i18n="autospeak"></span></label>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span data-i18n="conversation"></span></h2>
          <button class="btn" id="endBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span data-i18n="endConsult"></span></button>
        </div>
        <div class="thread" id="thread" aria-live="polite"></div>
        <form class="typebox" id="form" autocomplete="off">
          <input type="text" id="input" maxlength="500">
          <button type="submit" class="btn solid" id="send"></button>
        </form>
      </section>
    </div>

    <aside class="col">
      <section class="card">
        <div class="card-head"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span data-i18n="careGuidance"></span></h2></div>
        <ol class="steps" id="steps">
          <li><span class="num">1</span><div><b data-i18n="step1"></b><small data-i18n="step1d"></small></div></li>
          <li><span class="num">2</span><div><b data-i18n="step2"></b><small data-i18n="step2d"></small></div></li>
          <li><span class="num">3</span><div><b data-i18n="step3"></b><small data-i18n="step3d"></small></div></li>
          <li><span class="num">4</span><div><b data-i18n="step4"></b><small data-i18n="step4d"></small></div></li>
        </ol>
        <dl class="meta">
          <div><dt data-i18n="session"></dt><dd id="mSession" class="mono"></dd></div>
          <div><dt data-i18n="started"></dt><dd id="mStarted"></dd></div>
          <div><dt data-i18n="exchanges"></dt><dd id="mCount">0</dd></div>
          <div><dt data-i18n="voice"></dt><dd id="mVoice">-</dd></div>
        </dl>
      </section>
      <section class="notice" role="note">
        <b data-i18n="medTitle"></b>
        <p data-i18n="medText"></p>
      </section>
    </aside>
  </div>
</main>

<footer class="foot"><div class="wrap">
  <b data-i18n="footTitle"></b>
  <p data-i18n="footText"></p>
</div></footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
